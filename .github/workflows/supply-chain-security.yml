name: 'Supply Chain Security (Syft, Grype, Cosign)'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  build-and-sign:
    name: 'Build, Generate SBOM & Sign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local container image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:latest -f docker/Dockerfile .

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}:latest
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@v3
        with:
          sbom: sbom.spdx.json
          fail-build: false
          severity-cutoff: critical

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Verify Cosign Installation
        run: cosign version
